<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>linkards — Tu página de enlaces</title>
<meta name="description" content="Crea tu página de enlaces personalizada en segundos.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --accent: #6c5ce7;
    --accent-soft: #6c5ce74d;
    --bg: #0e0e13;
    --surface: #17171f;
    --surface-2: #1e1e28;
    --border: #2a2a36;
    --text: #f2f2f5;
    --muted: #9091a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  /* Halo decorativo de fondo, mismo lenguaje visual que el perfil público */
  .glow {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, var(--accent) 0%, var(--accent-soft) 40%, transparent 70%);
    filter: blur(60px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 30px;
    margin-bottom: 24px;
  }
  .badge i { color: var(--accent); }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  h1 span { color: var(--accent); }

  p.tagline {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 0 36px;
    padding: 0 8px;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); }

  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { filter: brightness(1.08); }

  .btn-secondary {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { border-color: var(--accent); }

  footer {
    margin-top: 48px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="glow"></div>

<div class="wrap">
  <div class="badge"><i class="fa-solid fa-link"></i> Tu página de enlaces</div>

  <h1>links<span>.</span></h1>
  <p class="tagline">Crea tu propia página de enlaces personalizada — redes sociales, proyectos y lo que quieras compartir, todo en un solo lugar.</p>

  <div class="actions">
    <a class="btn btn-primary" href="registro.html">
      <i class="fa-solid fa-user-plus"></i> Crear mi weblink
    </a>
    <a class="btn btn-secondary" href="admin.html">
      <i class="fa-solid fa-right-to-bracket"></i> Ya tengo cuenta, iniciar sesión
    </a>
  </div>
</div>

<footer>
  <p>© 2026 linkards. Todos los derechos reservados.</p>
</footer>

</body>
</html>
